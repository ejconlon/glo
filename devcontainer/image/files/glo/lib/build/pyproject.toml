[project]
name = "glo_build"
version = "0.1.0"
requires-python = ">=3.14"
description = "Lightweight build system for monorepos"
dependencies = [
    "cookiecutter>=2.6.0",
]

[project.scripts]
glo-build = "glo_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "licensecheck>=2025.1.0",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "ty>=0.0.64",
]
