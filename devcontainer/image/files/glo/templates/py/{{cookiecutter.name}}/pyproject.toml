[project]
name = "{{cookiecutter.name}}"
version = "{{cookiecutter.version}}"
requires-python = ">=3.14"
description = "{{cookiecutter.description}}"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.0", "pytest>=8.0", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
